<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" fill="none">
  <defs>
    <linearGradient id="git-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e3a"/>
      <stop offset="100%" style="stop-color:#2d2d5a"/>
    </linearGradient>
    <linearGradient id="git-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f05032"/>
      <stop offset="100%" style="stop-color:#ff6b4a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="250" fill="url(#git-bg)"/>
  <circle cx="200" cy="100" r="40" fill="none" stroke="url(#git-accent)" stroke-width="3"/>
  <circle cx="160" cy="80" r="8" fill="url(#git-accent)"/>
  <circle cx="200" cy="100" r="8" fill="url(#git-accent)"/>
  <circle cx="240" cy="80" r="8" fill="url(#git-accent)"/>
  <circle cx="200" cy="140" r="8" fill="url(#git-accent)"/>
  <line x1="160" y1="80" x2="200" y2="100" stroke="url(#git-accent)" stroke-width="2"/>
  <line x1="240" y1="80" x2="200" y2="100" stroke="url(#git-accent)" stroke-width="2"/>
  <line x1="200" y1="100" x2="200" y2="140" stroke="url(#git-accent)" stroke-width="2"/>
  <text x="200" y="195" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">Git</text>
  <text x="200" y="218" text-anchor="middle" fill="#888" font-family="Arial, sans-serif" font-size="14">Version Control</text>
</svg>
